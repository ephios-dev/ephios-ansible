---
- name: create secrets and set them as fact
  no_log: true
  block:
    - name: create smtp_password file
      shell: "openssl rand -base64 30 | tr -cd '[:alnum:]' > ~/.smtp-password"
      args:
        creates: "~/.smtp-password"
    - name: Read smtp_password
      shell: "cat ~/.smtp-password"
      register: cmd_output
    - name: Set smtp_password as fact
      set_fact:
        smtp_password: "{{ cmd_output.stdout }}"
      when: smtp_password is undefined

- name: uberspace add web domain
  shell: uberspace web domain add {{ domain }}
  register: web_domain_add
  changed_when: web_domain_add.rc == 0
  failed_when:
    - web_domain_add.rc != 0
    - "'must be unique' not in web_domain_add.stderr"

- name: set up web backends for separate documentroot
  block:
    - name: uberspace set application web backend
      shell: uberspace web backend add {{ domain }}/ port 8000 --force
      register: backend_app
      changed_when: backend_app.rc == 0
      failed_when:
        - backend_app.rc != 0
        - "'must make a unique set' not in backend_app.stderr"
    - name: uberspace set static web backend
      shell: uberspace web backend add {{ domain }}/static/ apache --force
      register: backend_static
      changed_when: backend_static.rc == 0
      failed_when:
        - backend_static.rc != 0
        - "'must make a unique set' not in backend_static.stderr"
      # as we don't have private media files, we can serve them via apache
    - name: uberspace set media web backend
      shell: uberspace web backend add {{ domain }}/media/ apache --force
      register: backend_media
      changed_when: backend_media.rc == 0
      failed_when:
        - backend_media.rc != 0
        - "'must make a unique set' not in backend_media.stderr"
  when: not use_main_documentroot

- name: set up web backends for main documentroot
  block:
    - name: uberspace set application web backend
      shell: uberspace web backend add / port 8000 --force
      register: backend_app_main
      changed_when: backend_app_main.rc == 0
      failed_when:
        - backend_app_main.rc != 0
        - "'must make a unique set' not in backend_app_main.stderr"
    - name: uberspace set static web backend
      shell: uberspace web backend add /static/ apache --force
      register: backend_static_main
      changed_when: backend_static_main.rc == 0
      failed_when:
        - backend_static_main.rc != 0
        - "'must make a unique set' not in backend_static_main.stderr"
      # as we don't have private media files, we can serve them via apache
    - name: uberspace set media web backend
      shell: uberspace web backend add /media/ apache --force
      register: backend_media_main
      changed_when: backend_media_main.rc == 0
      failed_when:
        - backend_media_main.rc != 0
        - "'must make a unique set' not in backend_media_main.stderr"
  when: use_main_documentroot

- name: set up uberspace mail
  no_log: true
  block:
    - name: uberspace add mail domain
      shell: uberspace mail domain add {{ smtp_domain or domain }}
      register: mail_domain_add
      changed_when: mail_domain_add.rc == 0
      failed_when:
        - mail_domain_add.rc != 0
        - "'must be unique' not in mail_domain_add.stderr"
        - "'already' not in mail_domain_add.stderr"
    - name: uberspace add mail address
      shell: "uberspace mail address add {{ smtp_mailbox }}@{{ smtp_domain or domain }} --password '{{ smtp_password }}'"
      register: mail_address_add
      changed_when: mail_address_add.rc == 0
      failed_when:
        - mail_address_add.rc != 0
        - "'must be unique' not in mail_address_add.stderr"
        - "'already' not in mail_address_add.stderr"
    - name: uberspace set mail password
      shell: "uberspace mail address set {{ smtp_mailbox }}@{{ smtp_domain or domain }} --password '{{ smtp_password }}'"
  when: smtp_host == ansible_host

- name: setup mysql
  include_tasks: mysql.yml
  when: database_driver == "mysql"

- name: setup postgresql
  include_tasks: postgres.yml
  when: database_driver == "postgres"

- name: install pyredis
  pip:
    name: redis
    state: latest
    executable: "{{ pip_executable }}"
    extra_args: --user

- name: upgrade pip
  pip:
    name: pip
    state: latest
    executable: "{{ pip_executable }}"
    extra_args: --user

- name: ensure systemd user unit directory exists
  file:
    path: ~/.config/systemd/user
    state: directory

- name: install and set up uwsgi
  block:
    - name: install uwsgi via pip
      pip:
        name: uwsgi
        state: latest
        executable: "{{ pip_executable }}"
        extra_args: --user
      notify:
        - restart uwsgi
    - name: create uwsgi apps-enabled directory
      file:
        path: ~/uwsgi/apps-enabled
        state: directory
    - name: create uwsgi err.log file
      file:
        path: ~/uwsgi/err.log
        state: touch
    - name: create uwsgi out.log file
      file:
        path: ~/uwsgi/out.log
        state: touch
    - name: copy uwsgi systemd service
      template:
        src: templates/uwsgi.service.j2
        dest: ~/.config/systemd/user/uwsgi.service
      notify:
        - reload systemd user daemon
        - restart uwsgi

- name: install and set up redis cache
  block:
    - name: create redis directory
      file:
        path: ~/.redis/
        state: directory
    - name: copy redis conf
      template:
        src: "templates/redis.conf.j2"
        dest: "~/.redis/conf"
      notify:
        - restart redis
    - name: copy redis systemd service
      template:
        src: "templates/redis.service.j2"
        dest: "~/.config/systemd/user/redis.service"
      notify:
        - reload systemd user daemon
        - restart redis

# Bring redis up before Django commands run — the cache backend connects on import.
- meta: flush_handlers

- name: enable and start redis service
  systemd:
    name: redis
    state: started
    enabled: yes
    scope: user

- name: wait for redis socket
  wait_for:
    path: "/home/{{ ansible_user }}/.redis/sock"
    timeout: 30

- name: install ephios
  pip:
    name: "{{ package_name }}"
    state: "{{ 'present' if ephios_version is defined else 'latest' }}"
    version: "{{ ephios_version | default(omit) }}"
    executable: "{{ pip_executable }}"
    extra_args: --user
  notify:
    - restart uwsgi

- name: install plugins
  pip:
    name: "{{ plugins }}"
    state: "latest"
    executable: "{{ pip_executable }}"
    extra_args: --user
  when: plugins is defined

- name: Create vapid keys
  shell: "~/.local/bin/vapid --gen"
  args:
    chdir: "~/"
    creates: "private_key.pem"

- name: copy ephios env
  template:
    src: "templates/ephios.env.j2"
    dest: "~/ephios.env"

- name: django migrate
  shell: set -a && source ~/ephios.env && set +a && {{ python_executable }} -m ephios migrate

- name: django collectstatic
  shell: set -a && source ~/ephios.env && set +a && {{ python_executable }} -m ephios collectstatic --no-input

- name: django compilemessages
  shell: set -a && source ~/ephios.env && set +a && {{ python_executable }} -m ephios compilemessages
  notify:
    - restart uwsgi

- name: django compile i18n javascript
  shell: set -a && source ~/ephios.env && set +a && {{ python_executable }} -m ephios compilejsi18n

- name: copy ephios uwsgi config
  template:
    src: "templates/ephios.ini.j2"
    dest: "~/uwsgi/apps-enabled/ephios.ini"
  notify:
    - restart uwsgi

# Trigger any pending handlers so units are installed/started before we enable them.
- meta: flush_handlers

- name: enable and start uwsgi service
  systemd:
    name: uwsgi
    state: started
    enabled: yes
    scope: user

- name: install periodic runner systemd service
  template:
    src: "templates/ephios-periodic.service.j2"
    dest: "~/.config/systemd/user/ephios-periodic.service"
  notify:
    - reload systemd user daemon

- name: install periodic runner systemd timer
  template:
    src: "templates/ephios-periodic.timer.j2"
    dest: "~/.config/systemd/user/ephios-periodic.timer"
  notify:
    - reload systemd user daemon

# Ensure the daemon-reload happened before we enable the timer.
- meta: flush_handlers

- name: enable and start periodic runner timer
  systemd:
    name: ephios-periodic.timer
    state: started
    enabled: yes
    scope: user
